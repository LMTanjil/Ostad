<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Assignment 2</title>
    <link rel="stylesheet" href="./dist/styles.css" />
  </head>
  <body class="bg-gray-50 text-gray-900">
    <!-- Header (wrapper > inner) -->
    <header class="bg-white shadow">
      <div class="container mx-auto px-4">
        <div class="max-w-6xl mx-auto flex items-center justify-between py-6">
          <div class="text-xl font-bold">Logo</div>
          <nav>
            <ul class="flex gap-6">
              <li><a href="#" class="hover:underline">Home</a></li>
              <li><a href="#" class="hover:underline">About</a></li>
              <li><a href="#" class="hover:underline">Contact</a></li>
            </ul>
          </nav>
        </div>
      </div>
    </header>

    <!-- Main sections -->
    <main>
      <!-- Hero section (wrapper > inner) -->
      <section class="py-20">
        <div class="container mx-auto px-4">
          <div class="max-w-5xl mx-auto text-center">
            <h1 class="text-4xl font-extrabold mb-4">Hero Title</h1>
            <p class="text-lg text-gray-600">Short description goes here.</p>
          </div>
        </div>
      </section>

      <!-- Features section (wrapper > inner) -->
      <section class="py-16 bg-white">
        <div class="container mx-auto px-4">
          <div class="max-w-6xl mx-auto grid grid-cols-1 md:grid-cols-3 gap-8">
            <div class="p-6 bg-gray-50 rounded">Feature 1</div>
            <div class="p-6 bg-gray-50 rounded">Feature 2</div>
            <div class="p-6 bg-gray-50 rounded">Feature 3</div>
          </div>
        </div>
      </section>

      <!-- Contact or CTA (wrapper > inner) -->
      <section class="py-16">
        <div class="container mx-auto px-4">
          <div class="max-w-3xl mx-auto text-center">
            <h2 class="text-2xl font-semibold mb-3">Call to action</h2>
            <p class="text-gray-600 mb-6">A short call to action message.</p>
            <a
              class="inline-block bg-blue-600 text-white px-6 py-3 rounded"
              href="#"
              >Get Started</a
            >
          </div>
        </div>
      </section>
    </main>

    <!-- Footer (wrapper > inner) -->
    <footer class="bg-gray-800 text-gray-200">
      <div class="container mx-auto px-4">
        <div class="max-w-6xl mx-auto py-8 flex items-center justify-between">
          <div>© 2026 My Project</div>
          <div>Links</div>
        </div>
      </div>
    </footer>
  </body>
</html>
