<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DoYu.Rent - Rent What You Need, List What You Own</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      body {
        font-family:
          "Inter",
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      .hero-gradient {
        background:
          linear-gradient(
            180deg,
            rgba(255, 255, 255, 0) 78.375%,
            rgba(255, 255, 255, 0.94) 100%
          ),
          linear-gradient(
            90deg,
            rgba(255, 255, 255, 0.7) 0%,
            rgba(255, 255, 255, 0.7) 100%
          );
      }

      .search-shadow {
        box-shadow:
          0px 5px 6px rgba(0, 64, 133, 0.08),
          0px 21px 10.5px rgba(0, 64, 133, 0.07),
          0px 48px 14.5px rgba(0, 64, 133, 0.04),
          0px 86px 17px rgba(0, 64, 133, 0.01),
          0px 134px 19px rgba(0, 64, 133, 0);
      }

      .keyboard-hint {
        background-color: #f9fafb;
        border-radius: 4px;
        padding: 4px 6px;
        font-size: 12px;
        color: #6b7280;
      }
    </style>
  </head>
  <body class="bg-white">
    <!-- Navigation Bar -->
    <nav class="border-b border-gray-200 sticky top-0 bg-white z-50">
      <div
        class="max-w-7xl mx-auto px-16 py-5 flex items-center justify-between">
        <!-- Logo -->
        <div class="flex-shrink-0">
          <span class="text-2xl font-bold text-gray-900">DOYU</span>
        </div>

        <!-- Nav Links -->
        <div class="flex items-center gap-8">
          <div
            class="flex items-center gap-1 text-gray-700 hover:text-gray-900 cursor-pointer">
            <span class="text-base font-medium">Explore</span>
            <svg
              class="w-4 h-4"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M19 14l-7 7m0 0l-7-7m7 7V3"></path>
            </svg>
          </div>
          <a
            href="#"
            class="text-base font-medium text-gray-700 hover:text-gray-900"
            >How it works</a
          >
          <a
            href="#"
            class="text-base font-medium text-gray-700 hover:text-gray-900"
            >List an Item</a
          >
        </div>

        <!-- Auth Buttons -->
        <div class="flex items-center gap-3">
          <button
            class="px-5 py-2 border border-blue-500 text-blue-500 rounded-lg font-medium hover:bg-blue-50 transition">
            Log In
          </button>
          <button
            class="px-5 py-2 bg-blue-500 text-white rounded-lg font-medium hover:bg-blue-600 transition">
            Sign Up
          </button>
        </div>
      </div>
    </nav>

    <!-- Hero Section -->
    <section
      class="hero-gradient relative py-24 min-h-screen flex flex-col items-center justify-center">
      <!-- Hero Content -->
      <div class="max-w-3xl mx-auto text-center mb-12 px-4">
        <!-- Main Heading -->
        <h1
          class="text-6xl font-bold text-gray-900 mb-6 leading-tight"
          style="letter-spacing: -0.04em">
          Rent What You Need<br />List What You Own
        </h1>

        <!-- Subheading -->
        <p class="text-lg text-gray-600 mb-8 max-w-2xl mx-auto">
          Turn idle items into income or find anything nearby—tools, gear,
          space, and more.
        </p>

        <!-- Search Bar -->
        <div
          class="search-shadow bg-white border border-gray-200 rounded-2xl p-4 flex items-center justify-between gap-4 max-w-md mx-auto">
          <!-- Search Input -->
          <div class="flex items-center gap-3 flex-1">
            <svg
              class="w-5 h-5 text-gray-400"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
            </svg>
            <input
              type="text"
              placeholder="What do you want to rent?"
              class="outline-none text-gray-700 placeholder-gray-500 text-base flex-1" />
          </div>

          <!-- Keyboard Hint -->
          <div class="flex items-center gap-1">
            <div class="keyboard-hint">⌘</div>
            <div class="keyboard-hint">K</div>
          </div>

          <!-- Filter Button -->
          <button
            class="border border-gray-200 rounded-lg p-2 hover:bg-gray-50 transition">
            <svg
              class="w-5 h-5 text-gray-600"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8v-2m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6-8a2 2 0 100-4m0 4a2 2 0 110-4m0-4V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4"></path>
            </svg>
          </button>
        </div>
      </div>

      <!-- Hero Image Gallery -->
      <div class="relative w-full mt-16 overflow-x-auto">
        <div class="flex gap-4 justify-center px-4 pb-8 min-w-max mx-auto">
          <!-- Image 1 - Gaming Console -->
          <div
            class="rounded-xl overflow-hidden flex-shrink-0 h-64 w-48 shadow-lg hover:shadow-xl transition">
            <img
              src="https://images.unsplash.com/photo-1538481143235-9b08a6e0c0fb?w=400&h=500&fit=crop"
              alt="Gaming Console"
              class="w-full h-full object-cover" />
          </div>

          <!-- Image 2 - PS5 Controller -->
          <div
            class="rounded-xl overflow-hidden flex-shrink-0 h-56 w-48 shadow-lg hover:shadow-xl transition">
            <img
              src="https://images.unsplash.com/photo-1605559424843-9e4c3ca4b7f1?w=400&h=500&fit=crop"
              alt="PS5 Controller"
              class="w-full h-full object-cover" />
          </div>

          <!-- Image 3 - Gaming PC -->
          <div
            class="rounded-xl overflow-hidden flex-shrink-0 h-72 w-56 shadow-lg hover:shadow-xl transition">
            <img
              src="https://images.unsplash.com/photo-1527814050087-3793815479db?w=400&h=600&fit=crop"
              alt="Gaming PC"
              class="w-full h-full object-cover" />
          </div>

          <!-- Image 4 - Acoustic Guitar -->
          <div
            class="rounded-xl overflow-hidden flex-shrink-0 h-80 w-64 shadow-lg hover:shadow-xl transition">
            <img
              src="https://images.unsplash.com/photo-1510915361894-db8b60106cb1?w=400&h=600&fit=crop"
              alt="Acoustic Guitar"
              class="w-full h-full object-cover" />
          </div>

          <!-- Image 5 - Camera -->
          <div
            class="rounded-xl overflow-hidden flex-shrink-0 h-72 w-56 shadow-lg hover:shadow-xl transition">
            <img
              src="https://images.unsplash.com/photo-1606986628025-35d57e735ae0?w=400&h=600&fit=crop"
              alt="Camera"
              class="w-full h-full object-cover" />
          </div>

          <!-- Image 6 - VR Headset -->
          <div
            class="rounded-xl overflow-hidden flex-shrink-0 h-60 w-48 shadow-lg hover:shadow-xl transition">
            <img
              src="https://images.unsplash.com/photo-1617638924702-92d37921e0b6?w=400&h=500&fit=crop"
              alt="VR Headset"
              class="w-full h-full object-cover" />
          </div>

          <!-- Image 7 - Car -->
          <div
            class="rounded-xl overflow-hidden flex-shrink-0 h-80 w-64 shadow-lg hover:shadow-xl transition">
            <img
              src="https://images.unsplash.com/photo-1552820728-8ac41f1ce891?w=400&h=600&fit=crop"
              alt="Car"
              class="w-full h-full object-cover" />
          </div>
        </div>
      </div>
    </section>
  </body>
</html>
